    <noscript>
      <header style="padding: 24px; font-family: sans-serif; background: #0f172a; color: #f8fafc;">
        <h1>Metra Perú — Calculadora de Materiales de Construcción en Perú</h1>
        <p>Herramienta técnica de metrados y dosificación según el Reglamento Nacional de Edificaciones (RNE E.050, E.060, E.070) y tablas Capeco.</p>
      </header>
      <main style="padding: 20px; font-family: sans-serif; line-height: 1.6; max-width: 800px;">
        <h2>Módulos de cálculo disponibles</h2>
        <ul>
          <li><strong>Zapatas aisladas:</strong> Dimensionamiento según carga axial y tipo de suelo (blando, intermedio, duro), concreto f'c 210/245/280, parrilla de fierro y solado 1:10.</li>
          <li><strong>Cimientos corridos y sobrecimientos:</strong> Concreto ciclópeo 1:10 + 30% piedra grande y 1:8 + 25% piedra mediana.</li>
          <li><strong>Muros de albañilería:</strong> Ladrillo King Kong 18 huecos y pandereta en soga, cabeza o canto, con volumen de mortero y desperdicio.</li>
          <li><strong>Columnas de confinamiento y pórticos:</strong> Concreto f'c 175/210, varillas longitudinales de 1/2", 5/8", 3/4" y distribución de estribos según norma sísmica E.060.</li>
          <li><strong>Vigas y Losas Aligeradas:</strong> Peralte económico L/25, ladrillos de techo 30x30 (8.33 und/m²), viguetas cada 40 cm y acero superior/inferior.</li>
          <li><strong>Acabados y revoques:</strong> Tarrajeo en muros y cielorrasos con mortero 1:5, contrapiso y rendimiento de pintura látex.</li>
        </ul>
        <h2>Preguntas frecuentes</h2>
        <p><strong>¿Cuántas bolsas de cemento se necesitan por m³ de concreto f'c 210?</strong> Según la tabla Capeco, 9.73 bolsas de 42.5 kg, 0.52 m³ de arena gruesa, 0.53 m³ de piedra chancada y 0.186 m³ de agua.</p>
        <p><strong>¿Cuántos ladrillos King Kong entran por m²?</strong> Para King Kong 18 huecos de 24×13×9 cm, junta de 1.5 cm y aparejo de soga, 37 unidades por m²; con 5% de desperdicio, aproximadamente 39.</p>
        <p><em>Para utilizar las calculadoras interactivas y los visores 3D, activa JavaScript en tu navegador.</em></p>
      </main>
    </noscript>
