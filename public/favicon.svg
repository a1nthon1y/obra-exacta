<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f5b70a"/>
    </linearGradient>
  </defs>

  <!-- Fondo tipo plano de obra -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="#334155" stroke-width="8" stroke-dasharray="16 12"/>
  <path d="M96 160h320M96 256h320M96 352h320M160 96v320M256 96v320M352 96v320" stroke="#1e293b" stroke-width="3"/>

  <!-- M de Metra: dos trazos de medida que se encuentran -->
  <path d="M124 368V168L256 300L388 168V368" stroke="url(#accent)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cinta métrica: base y marcas -->
  <rect x="96" y="430" width="320" height="30" rx="15" fill="url(#tape)"/>
  <g stroke="#0f172a" stroke-width="6" stroke-linecap="round">
    <path d="M128 430v14M176 430v20M224 430v14M272 430v20M320 430v14M368 430v20M416 430v14"/>
  </g>

  <!-- Sello Perú -->
  <rect x="354" y="64" width="98" height="48" rx="24" fill="url(#accent)"/>
  <text x="403" y="97" text-anchor="middle" fill="#22252c" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1">PE</text>
</svg>
