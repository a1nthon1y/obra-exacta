<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="#334155" stroke-width="8" stroke-dasharray="16 12" fill="none"/>
  
  <!-- Architectural grid accents -->
  <path d="M96 160h320M96 256h320M96 352h320M160 96v320M256 96v320M352 96v320" stroke="#1e293b" stroke-width="3"/>

  <!-- Construction brick layers / structure -->
  <g transform="translate(116, 126)">
    <!-- Top Brick -->
    <rect x="50" y="30" width="180" height="60" rx="10" fill="url(#accent)"/>
    <circle cx="85" cy="60" r="12" fill="#b45309" opacity="0.6"/>
    <circle cx="140" cy="60" r="12" fill="#b45309" opacity="0.6"/>
    <circle cx="195" cy="60" r="12" fill="#b45309" opacity="0.6"/>

    <!-- Bottom Left Brick -->
    <rect x="0" y="105" width="130" height="60" rx="10" fill="url(#cyanGrad)"/>
    <circle cx="40" cy="135" r="12" fill="#0369a1" opacity="0.6"/>
    <circle cx="90" cy="135" r="12" fill="#0369a1" opacity="0.6"/>

    <!-- Bottom Right Brick -->
    <rect x="150" y="105" width="130" height="60" rx="10" fill="url(#cyanGrad)"/>
    <circle cx="190" cy="135" r="12" fill="#0369a1" opacity="0.6"/>
    <circle cx="240" cy="135" r="12" fill="#0369a1" opacity="0.6"/>

    <!-- Precision Drafting Compass / Caliper -->
    <path d="M140 180 L80 250 M140 180 L200 250" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
    <circle cx="140" cy="180" r="16" fill="#f59e0b" stroke="#f8fafc" stroke-width="6"/>
    <path d="M98 228 Q140 242 182 228" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
