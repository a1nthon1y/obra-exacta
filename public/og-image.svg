<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Technical blueprint grid lines -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.7">
    <path d="M0 70h1200 M0 140h1200 M0 210h1200 M0 280h1200 M0 350h1200 M0 420h1200 M0 490h1200 M0 560h1200"/>
    <path d="M80 0v630 M160 0v630 M240 0v630 M320 0v630 M400 0v630 M480 0v630 M560 0v630 M640 0v630 M720 0v630 M800 0v630 M880 0v630 M960 0v630 M1040 0v630 M1120 0v630"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="260" fill="#0284c7" opacity="0.12"/>
  <circle cx="1020" cy="450" r="280" fill="#f59e0b" opacity="0.10"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" stroke="#334155" stroke-width="2"/>

  <!-- Content Left -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="42" rx="21" fill="rgba(56, 189, 248, 0.12)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="18" y="27" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1">🇵🇪 PERÚ · NORMA RNE Y CAPECO</text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
      OBRA EXACTA
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="url(#amberGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34">
      Calculadora de Materiales de Construcción
    </text>

    <!-- Description -->
    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      Cálculo exacto de cemento, arena, piedra, ladrillos KK18 y fierro
    </text>
    <text x="0" y="270" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      para zapatas, cimientos, muros, columnas, vigas, losas y acabados.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="165" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="16">🧱 Ladrillos KK18</text>

      <rect x="180" y="0" width="160" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="200" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="16">🏗️ Concreto f'c</text>

      <rect x="355" y="0" width="145" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="375" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="16">📐 Acero/Fierro</text>

      <rect x="515" y="0" width="155" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="535" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="16">✨ Visor 3D Real</text>
    </g>

    <!-- Call to action badge -->
    <g transform="translate(0, 395)">
      <text x="0" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="18">
        ✓ 100% Gratis · Sin Registro · Funciona en Celular y PC
      </text>
    </g>
  </g>

  <!-- Right Visual Graphics: 3D Element Silhouette -->
  <g transform="translate(860, 160)">
    <!-- Column/Zapata Isometric Graphic -->
    <polygon points="120,40 220,95 220,320 120,265" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="20,95 120,40 120,265 20,320" fill="#0f172a" stroke="#0284c7" stroke-width="3"/>
    <polygon points="20,95 120,40 220,95 120,150" fill="#334155" stroke="#38bdf8" stroke-width="3"/>

    <!-- Rebar lines -->
    <line x1="120" y1="20" x2="120" y2="350" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="70" y2="340" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="70" x2="170" y2="340" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

    <!-- Stirrups (Estribos) -->
    <path d="M50 140 L120 100 L190 140 L120 180 Z" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <path d="M50 210 L120 170 L190 210 L120 250 Z" stroke="#fbbf24" stroke-width="3" fill="none"/>
    <path d="M50 280 L120 240 L190 280 L120 320 Z" stroke="#fbbf24" stroke-width="3" fill="none"/>
  </g>
</svg>
